# Render Blueprint: https://render.com/docs/blueprint-spec
# Connect this repo in Render → New → Blueprint → deploy.

databases:
  - name: civic-db
    plan: free
    databaseName: civic_copilot
    user: civic

services:
  - type: web
    name: civic-co-pilot
    runtime: node
    plan: free
    buildCommand: >-
      corepack enable &&
      pnpm install &&
      pnpm run build:deploy &&
      pnpm run db:push &&
      pnpm run db:seed
    startCommand: pnpm run start
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "8080"
      - key: BASE_PATH
        value: /
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: civic-db
          property: connectionString
