kind = "web"
previewPath = "/"
title = "Civic Co-Pilot"
version = "1.0.0"
id = "artifacts/civic-copilot"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20671

[services.development]
run = "pnpm --filter @workspace/civic-copilot run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/civic-copilot", "run", "build" ]
publicDir = "artifacts/civic-copilot/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20671"
BASE_PATH = "/"
